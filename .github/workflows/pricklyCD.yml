name: Prickly-CD

on:
  workflow_run:
    workflows: [Go-CI]
    types: completed
    
permissions: 
  id-token: write
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::753674274065:role/cicd-pipeline
          aws-region: ap-southeast-1

      - name: Creating User Data
        run: |
          sed -i "s/__GITHUB_SHA__/$GITHUB_SHA/g" scripts/user-data.sh
          USER_DATA=$(base64 -w 0 scripts/user-data.sh)
      - name: Creating Launch Template
        run: |
          aws sts get-caller-identity
          NEW_VERSION= $(aws ec2 create-launch-template-version \
          --launch-template-id lt-0a60e71b1851d8033 \
          --source-version $LATEST \
          --launch-template-data "{\"UserData\":\"$USER_DATA\"}" \
          --query "LaunchTemplateVersions.VersionNumber"\
          --output text
          )
          aws ec2 modify-launch-template \
          --launch-template-id lt-0a60e71b1851d8033 \
          --default-version $NEW_VERSION

          aws autoscaling start-instance-refresh \
          --auto-scaling-group-name "spikeypear-test"


    
      
        
        
      
      
