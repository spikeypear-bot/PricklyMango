# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Build
      run: go build -v -o bin/dist ./cmd

    - name: Test
      run: go test -v ./...
      
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        role-to-assume: arn:aws:iam::753674274065:role/cicd-pipeline
        aws-region: ap-southeast-1
    - name: Upload files to S3 bucket
      run: |
        aws sts get-caller-identity
        aws s3 cp ./bin/dist s3://test-s3-bucket-753674274065-ap-southeast-1-an/artifaces/$GITHUB_SHA/
        
        
